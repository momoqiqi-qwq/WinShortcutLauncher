[package]
name = "shortcut-launcher"
version = "0.1.198"
description = "Windows desktop shortcut launcher built with Tauri 2, React and TypeScript"
authors = ["Ava Wright"]
edition = "2021"

[lib]
name = "shortcut_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# 仅为修复构建：tauri-build 的 schemars 0.8.22 在启用 preserve_order 时会写
# `indexmap::IndexMap<K, V>`，而 indexmap 1.9.3 的 Cargo.toml 没有 `default = ["std"]`，
# build 依赖图里 std 未开就直接 E0107（struct takes 3 generic arguments）。
# resolver v2 下 build 图与主依赖图分开合并，所以必须在这里（而不是 [dependencies]）
# 显式打开 indexmap 1.9 的 std，把编译依赖钉回可用组合。
indexmap = { version = "1.9", features = ["std"] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
base64 = "0.22"
png = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "charset", "http2", "rustls-tls"] }
html-escape = "0.2"
flate2 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_Registry", "Win32_Security", "Win32_Security_Cryptography"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.61"

# v159: 发布构建优化。整程序 LTO + 单代码生成单元让编译器跨 crate 内联、裁掉没用到的代码，
# 产物更小也更快，代价是 release 编译变慢；strip 去掉符号表。
# 刻意不改 panic 策略（保持 unwind）：命令里万一 panic，只会让那一次调用失败；改成 abort 会直接带走整个程序。
[profile.release]
codegen-units = 1
lto = true
strip = true
